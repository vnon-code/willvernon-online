        // --- Character Text Scrambler System (Options 1, 2, 3, 4) ---
        const technicalChars = "01XY/[]_#&@$%?><*";
        
        function scrambleText(element, speedOverride) {
            if (element.dataset.isScrambling === "true") return;
            element.dataset.isScrambling = "true";

            const originalText = element.dataset.original || element.textContent.trim();
            if (!element.dataset.original) {
                element.dataset.original = originalText;
            }

            // Snappy reveal speeds: descriptions decrypt under 0.75s, titles flicker longer
            const speedStep = speedOverride || (originalText.length > 20 ? 4.5 : 1 / 3);
            let iteration = 0;
            
            const interval = setInterval(() => {
                element.textContent = originalText
                    .split("")
                    .map((char, index) => {
                        // Preserve spaces, brackets, underscores, and greater-than symbols
                        if (char === " " || char === "[" || char === "]" || char === "_" || char === ">") return char;
                        if (index < iteration) {
                            return originalText[index];
                        }
                        return technicalChars[Math.floor(Math.random() * technicalChars.length)];
                    })
                    .join("");

                if (iteration >= originalText.length) {
                    clearInterval(interval);
                    element.textContent = originalText; // Lock to clean text
                    element.dataset.isScrambling = "false";
                }
                iteration += speedStep;
            }, 30);
        }

        // Helper to bind scrambles to hover events
        function bindScrambleHover(selector) {
            const elements = document.querySelectorAll(selector);
            elements.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    scrambleText(el);
                });
                el.addEventListener('mouseleave', () => {
                    if (el.dataset.original) {
                        el.textContent = el.dataset.original;
                        el.dataset.isScrambling = "false";
                    }
                });
                el.addEventListener('touchstart', () => {
                    scrambleText(el);
                }, { passive: true });
            });
        }

                                        <i class="ph ph-terminal"></i>
                                        <span id="active-step-title">Initializing...</span>
                                    </div>
                                    <div class="viewport-telemetry">
                                        <span id="active-step-num">SYS_INIT</span>
                                    </div>
                                </div>

                                <!-- Live Interactive Canvas -->
                                <div class="viewport-canvas">
                                    <div class="viewport-grid-dots"></div>
                                    
                                    <div class="canvas-media-container" id="canvas-media-container">
                                        <!-- Active step media (video, images, responsive video list, or SVG graph) rendered dynamically -->
                                    </div>

                                    <!-- HUD Floating Overlays -->
                                    <div class="canvas-telemetry-hud">
                                        <div class="hud-item">
                                            <span class="hud-lbl">LATENCY:</span>
                                            <span class="hud-val">0.8ms</span>
                                        </div>
                                        <div class="hud-item">
                                            <span class="hud-lbl">RESOLUTION:</span>
                                            <span class="hud-val">1920x1080</span>
                                        </div>
                                        <div class="hud-item">
                                            <span class="hud-lbl">FPS:</span>
                                            <span class="hud-val pulse-val" id="hud-fps-value">60.00</span>
                                        </div>
                                    </div>
                                </div>

                                <!-- Metadata Bottom Drawer -->
                                <div class="viewport-description">
                                    <p id="active-step-desc">Loading metadata stream...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // Handle step switching logic
                const switchActiveStep = (idx) => {
                    const file = files[idx];
                    if (!file) return;

                    // Pause old videos in drawer if any
                    const canvasMedia = document.getElementById('canvas-media-container');
                    const activeVideos = canvasMedia.querySelectorAll('video');
                    activeVideos.forEach(v => v.pause());

                    // Apply glitch filter effect to the canvas to look high-tech
                    const canvas = document.querySelector('.viewport-canvas');
                    canvas.classList.remove('glitch-flash');
                    void canvas.offsetWidth; // Force DOM reflow
                    canvas.classList.add('glitch-flash');

                    // Set title and details
                    const titleText = document.getElementById('active-step-title');
                    const correctTitle = `${file.num}. ${file.title}`;
                    titleText.textContent = correctTitle;
                    titleText.dataset.original = correctTitle; // Force overwrite caching so scrambler resolves to the correct step!
                    titleText.dataset.isScrambling = "false";
                    
                    document.getElementById('active-step-num').textContent = `MODULE_${file.num}`;
                    document.getElementById('active-step-desc').textContent = file.desc;

                    // Compile and inject media content
                    let mediaHtml = '';
                    if (file.mediaType === 'video') {
                        mediaHtml = `<video src="${file.mediaSrc}" autoplay muted loop playsinline controls class="glitch-flash"></video>`;
                    } else if (file.mediaType === 'image') {
                        mediaHtml = `<img src="${file.mediaSrc}" alt="${file.title}" class="glitch-flash">`;
                    } else if (file.mediaType === 'svg') {
                        mediaHtml = file.mediaSrc;
                    }
                    
                    canvasMedia.innerHTML = mediaHtml;

                    // If remnants step 05, initialize draggable parts
                    if (proj.id === '03' && file.num === '05') {
                        if (window.initRemnantsDraggable) {
                            window.initRemnantsDraggable();
                        }
                    }

                    // Bind hover events to scramble titles on active step load if desired
                    scrambleText(titleText, 0.5);
                };

                // Bind click event to file buttons
                const fileButtons = slideover.querySelectorAll('.file-item');
                fileButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        // Clear active states
                        fileButtons.forEach(b => b.classList.remove('active'));
                        // Add to current
                        btn.classList.add('active');
                        // Switch active content
                        const idx = parseInt(btn.getAttribute('data-index'), 10);
                        switchActiveStep(idx);
                    });
                });

                // Load initial step (outcome video/master file)
                switchActiveStep(0);

                // Start active telemetries flicker loop
                const fpsLabel = document.getElementById('hud-fps-value');
                if (fpsLabel) {
                    activeConsoleInterval = setInterval(() => {
                        const randomFps = (58.5 + Math.random() * 1.5).toFixed(2);
                        fpsLabel.textContent = randomFps;
                    }, 500);
                }

                // Bind close button
                document.getElementById('console-close-btn').addEventListener('click', closeSlideover);

                backdrop.classList.add('active');
                slideover.classList.add('active');
                document.body.classList.add('overflow-hidden');
            };
            
            const closeSlideover = () => {
                backdrop.classList.remove('active');
                slideover.classList.remove('active');
                slideover.classList.remove('console-mode');
                document.body.classList.remove('overflow-hidden');
                
                // Clear telemetry timer
                if (activeConsoleInterval) {
                    clearInterval(activeConsoleInterval);
                    activeConsoleInterval = null;
                }

                const activeVideos = slideover.querySelectorAll('video');
                activeVideos.forEach(v => v.pause());
            };
            
            projects.forEach(card => {
                card.addEventListener('click', () => {
                    const projId = card.getAttribute('data-id');
                    openSlideover(projId);
                });
            });
            
            backdrop.addEventListener('click', closeSlideover);
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeSlideover();
            });

            // 2. Extract unique tags from database array and categorize
            const SOFTWARE_KEYS = ["Blender", "TouchDesigner", "After Effects", "Stable Diffusion", "ControlNet", "Illustrator", "Photoshop", "InDesign", "ComfyUI", "Midjourney", "Cinema 4D", "Premiere Pro"];
            
            const uniqueSoftware = new Set();
            const uniqueDiscipline = new Set();

            PROJECTS_DATA.forEach(proj => {
                proj.tags.forEach(tag => {
                    const cleanTag = tag.trim();
                    if (SOFTWARE_KEYS.includes(cleanTag)) {
                        uniqueSoftware.add(cleanTag);
                    } else {
                        uniqueDiscipline.add(cleanTag);
                    }
                });
            });

            // 3. Create Filter Tag buttons
            const createFilterBtn = (text) => {
                const btn = document.createElement('button');
                btn.textContent = text;
                btn.className = `filter-btn`;
                return btn;
            };

            const filterButtons = [];
            const softwareContainer = document.getElementById('software-filter-container');
            const disciplineContainer = document.getElementById('discipline-filter-container');

            Array.from(uniqueSoftware).sort().forEach(tag => {
                const btn = createFilterBtn(tag);
                softwareContainer.appendChild(btn);
                filterButtons.push({ element: btn, tag: tag });
            });

            Array.from(uniqueDiscipline).sort().forEach(tag => {
                const btn = createFilterBtn(tag);
                disciplineContainer.appendChild(btn);
                filterButtons.push({ element: btn, tag: tag });
            });

            // 4. Evaluation Function for Filtering grid cards
            const evaluateProjects = () => {
                let anyActive = activeFilters.size > 0;
                
                clearFiltersBtn.classList.toggle('active', anyActive);

                const visibleProjects = new Set();
                projects.forEach(project => {
                    const projectTags = project.getAttribute('data-tags').split(',').map(t => t.trim());
                    
                    let isMatch = true;
                    for (let filter of activeFilters) {
                        if (!projectTags.includes(filter)) {
                            isMatch = false;
                            break;
                        }
                    }

                    if (isMatch || !anyActive) {
                        visibleProjects.add(project);
                        project.classList.remove('hidden-project');
                    } else {
                        project.classList.add('hidden-project');
                    }
                });

                const availableTagsNext = new Set();
                visibleProjects.forEach(proj => {
                    proj.getAttribute('data-tags').split(',').forEach(t => availableTagsNext.add(t.trim()));
                });

                filterButtons.forEach(btnObj => {
                    if (activeFilters.has(btnObj.tag) || availableTagsNext.has(btnObj.tag)) {
                        btnObj.element.classList.remove('hidden-filter');
                    } else {
                        btnObj.element.classList.add('hidden-filter');
                    }
                });
            };

            // 5. Click Events for Filter Buttons
            filterButtons.forEach(btnObj => {
                btnObj.element.addEventListener('click', () => {
                    if (activeFilters.has(btnObj.tag)) {
                        activeFilters.delete(btnObj.tag);
                        btnObj.element.classList.remove('active');
                    } else {
                        activeFilters.add(btnObj.tag);
                        btnObj.element.classList.add('active');
                    }
                    evaluateProjects();
                });
            });

            // 6. Clear Filters Action
            clearFiltersBtn.addEventListener('click', () => {
                activeFilters.clear();
                filterButtons.forEach(b => b.element.classList.remove('active'));
                evaluateProjects();
            });

            // Remnants Interactive Draggable Layer Logic (Section 5)
            window.resetRemnantsBreakdown = () => {
                const draggables = document.querySelectorAll('.remnants-draggable');
                draggables.forEach(el => {
                    el.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
                    el.style.transform = 'translate3d(0, 0, 0)';
                    el.setAttribute('data-x', '0');
                    el.setAttribute('data-y', '0');
                    setTimeout(() => {
                        el.style.transition = 'transform 0.05s ease-out';
                    }, 500);
                });
            };

            window.initRemnantsDraggable = () => {
                const draggables = document.querySelectorAll('.remnants-draggable');
                draggables.forEach(el => {
                    // Prevent browser native image dragging ghosting and cancel cursor
                    el.addEventListener('dragstart', (e) => e.preventDefault());

                    // Track position offsets
                    let startX = 0, startY = 0;
                    let currentX = parseFloat(el.getAttribute('data-x') || '0');
                    let currentY = parseFloat(el.getAttribute('data-y') || '0');
                    let isDragging = false;

                    const dragStart = (e) => {
                        isDragging = true;
                        el.style.transition = 'none';
                        el.style.cursor = 'grabbing';
                        
                        // Handle touch vs mouse
                        const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
                        const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
                        
                        startX = clientX - currentX;
                        startY = clientY - currentY;

                        // Prevent default scrolling on mobile when dragging
                        if (e.type === 'touchstart') {
                            e.preventDefault();
                        }
                    };

                    const dragMove = (e) => {
                        if (!isDragging) return;
                        
                        const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
                        const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
                        
                        currentX = clientX - startX;
                        currentY = clientY - startY;

                        // Set values
                        el.setAttribute('data-x', currentX);
                        el.setAttribute('data-y', currentY);
                        el.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;

                        // Prevent scroll on touchmove
                        e.preventDefault();
                    };

                    const dragEnd = () => {
                        if (!isDragging) return;
                        isDragging = false;
                        el.style.cursor = 'grab';
                        el.style.transition = 'transform 0.05s ease-out';
                    };

                    // Bind mouse events
                    el.addEventListener('mousedown', dragStart);
                    window.addEventListener('mousemove', dragMove);
                    window.addEventListener('mouseup', dragEnd);

                    // Bind touch events
                    el.addEventListener('touchstart', dragStart, { passive: false });
                    el.addEventListener('touchmove', dragMove, { passive: false });
                    el.addEventListener('touchend', dragEnd);
                });
            };

            // 7. Check URL Hash to Auto-Open Case Study
            const handleHashChange = () => {
                const hash = window.location.hash; // e.g. '#06' or '#01'
                if (hash) {
                    const projId = hash.substring(1);
                    // Small timeout ensures that renderProjects() has finished compiling elements
                    setTimeout(() => {
                        openSlideover(projId);
                    }, 150);
                }
            };

            // Check on load
            handleHashChange();
            // Listen for changes
            window.addEventListener('hashchange', handleHashChange);
        });
    </script>
</body>
