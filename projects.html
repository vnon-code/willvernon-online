                descLong: "Exploring the workflow synergy of machine learning ideation and high-fidelity CGI. We utilized SDXL and ControlNet grids to rapidly conceptualize and iterate an arid desert hideout dome, adjusting prompt weights. The optimal structural generation was utilized as a flat model blueprint. I then migrated into Blender to construct the wireframe mesh, positioning light paths, sculpting meshes and applying organic materials.",

                outcomeLabel: "Viewport Animated Loop",
                process: [
                    {

                        mediaSrc: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225"><rect width="100%" height="100%" fill="#030303"/><g stroke="rgba(255,255,255,0.05)" stroke-width="0.5"><line x1="20" y1="112" x2="380" y2="112"/><line x1="200" y1="20" x2="200" y2="205"/></g><g fill="rgba(217, 28, 28, 0.3)"><circle cx="150" cy="80" r="4"/><circle cx="130" cy="90" r="3"/><circle cx="160" cy="70" r="5"/><circle cx="280" cy="140" r="4"/><circle cx="260" cy="150" r="3"/><circle cx="290" cy="130" r="5"/></g><path d="M 150 80 Q 200 112 280 140" stroke="#D91C1C" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/><circle cx="150" cy="80" r="2" fill="#fff"/><circle cx="280" cy="140" r="2" fill="#fff"/><rect x="25" y="25" width="115" height="35" fill="rgba(0,0,0,0.7)" stroke="rgba(255,255,255,0.1)"/><text x="30" y="35" fill="#fff" font-family="Space Mono, monospace" font-size="4.5">PROMPT: desert_outpost_dome</text><text x="30" y="43" fill="#D91C1C" font-family="Space Mono, monospace" font-size="4.5">CFG_SCALE: 7.5 [SDXL]</text><text x="30" y="51" fill="#D91C1C" font-family="Space Mono, monospace" font-size="4.5">STEPS: 30/30 [COMPLETE]</text></svg>`

            {

                descLong: "Designing for a massive global community required an adaptable, culturally agnostic visual approach. The campaign relies heavily on powerful, copy-led storytelling designed to unite players. Kinetic typographic layouts were paired with bold 3D motion design and rendering developed in Cinema 4D and Blender, ensuring the campaign retained maximum energy.",
                tags: ["Campaign", "Motion Design"],
                mediaType: "image",
                mediaSrc: "https://assets.willvernon.online/projects/07_the-world-plays-here/assets/LogoAnimGif.gif",
                outcomeLabel: "Campaign Animated Loop",
                process: [
                    {
                        num: "01",
                        title: "Global Storytelling & Copy",
                        desc: "Designing for a massive global community required an adaptable, culturally agnostic visual approach. The campaign relies heavily on powerful, copy-led storytelling designed to unite players.",
                        mediaType: "svg",
                        mediaSrc: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225"><rect width="100%" height="100%" fill="#030303"/><rect x="50" y="30" width="300" height="160" fill="none" stroke="rgba(255,255,255,0.06)"/><line x1="50" y1="80" x2="350" y2="80" stroke="rgba(255,255,255,0.06)"/><text x="60" y="60" fill="#fff" font-family="Space Grotesk, sans-serif" font-weight="bold" font-size="12">THE WORLD PLAYS HERE.</text><g fill="rgba(255,255,255,0.4)" font-family="Space Mono, monospace" font-size="5"><text x="60" y="100">■ JAPANESE: 世界は여기서 놀다</text><text x="60" y="115">■ KOREAN: 세상은 여기서 플레이한다</text><text x="60" y="130">■ SPANISH: EL MUNDO JUEGA AQUÍ</text></g><line x1="50" y1="25" x2="50" y2="195" stroke="#D91C1C" stroke-width="0.5" stroke-dasharray="2,2"/><text x="32" y="112" fill="#D91C1C" font-family="Space Mono, monospace" font-size="4">GRID_MARGIN</text></svg>`
                    },
                    {
                        num: "02",
                        title: "Kinetic Typography Screen Mocks",
                        desc: "Kinetic typographical systems are prototyped and animated inside After Effects, then contextualized across digital laptop and mobile device screens to test scale and responsive grids.",
                        mediaType: "image",
                        mediaSrc: "https://assets.willvernon.online/projects/07_the-world-plays-here/assets/mockups/LaptopMock1.png"
                    },
                    {
                        num: "03",
                        title: "Urban OOH Subway Campaigns",
                        desc: "Final visual outcomes are mapped onto urban environment physical mockups, including massive illuminated subway signs and outdoor bus shelters to showcase global scale.",
                        mediaType: "image",
                        mediaSrc: "https://assets.willvernon.online/projects/07_the-world-plays-here/assets/mockups/XboxSubway1.png"
                    }
                ]
            }
        ];

        // Multi-Select Filtering & Slider Interaction Logic
        document.addEventListener('DOMContentLoaded', () => {
            const projectsWrapper = document.getElementById('projects-wrapper');
            const filterContainer = document.getElementById('filter-container');
            const clearFiltersBtn = document.getElementById('clear-filters');
            const slideover = document.getElementById('project-slideover');
            const backdrop = document.getElementById('slideover-backdrop');
            
            let activeFilters = new Set();
            
            // 1. Render all cards dynamically
            const renderProjects = () => {
                projectsWrapper.innerHTML = '';
                PROJECTS_DATA.forEach(proj => {
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    card.setAttribute('data-id', proj.id);
                    card.setAttribute('data-tags', proj.tags.join(','));
                    
                    let mediaHtml = '';
                    if (proj.mediaType === 'video') {
                        mediaHtml = `<video src="${proj.mediaSrc}" muted loop playsinline class="splash-video"></video>`;
                    } else if (proj.mediaType === 'image') {
                        mediaHtml = `<img src="${proj.mediaSrc}" class="splash-video" alt="${proj.title}">`;
                    } else if (proj.mediaType === 'svg') {
                        mediaHtml = `<div class="splash-video-svg-wrapper" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#030303;">${proj.mediaSrc}</div>`;
                    }
                    
                    card.innerHTML = `
                        <div class="project-card-media-wrapper">
                            ${mediaHtml}
                            <div class="project-card-overlay">
                                <div class="project-card-splash-label">${proj.outcomeLabel}</div>
                            </div>
                        </div>
                        <div class="project-card-content">
                            <div class="project-card-header">
                                <span class="project-card-num">${proj.id} /</span>
                                <h3 class="project-card-title">${proj.title}</h3>
                            </div>
                            <p class="project-card-desc">${proj.descShort}</p>
                            <div class="project-card-tags">
                                ${proj.tags.map(t => `<span>${t}</span>`).join('')}
                            </div>
                            <div class="project-card-footer">
                                <span>[ View Case Study ]</span>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </div>
                        </div>
                    `;
                    
                    projectsWrapper.appendChild(card);
                });
            };
            
            renderProjects();
            
            const projects = document.querySelectorAll('.project-card');

            // Bind video hover play/pause
            projects.forEach(card => {
                const video = card.querySelector('video');
                if (video) {
                    card.addEventListener('mouseenter', () => {
                        video.play().catch(err => console.log('Video autoplay blocked or interrupted:', err));
                    });
                    card.addEventListener('mouseleave', () => {
                        video.pause();
                        video.currentTime = 0;
                    });
                }
            });

            // Slide-over logic
            const openSlideover = (projId) => {
                const proj = PROJECTS_DATA.find(p => p.id === projId);
                if (!proj) return;
                
                let mediaHtml = '';
                if (proj.mediaType === 'video') {
                    mediaHtml = `<video src="${proj.mediaSrc}" autoplay muted loop playsinline></video>`;
                } else if (proj.mediaType === 'image') {
                    mediaHtml = `<img src="${proj.mediaSrc}" alt="${proj.title}">`;
                } else if (proj.mediaType === 'svg') {
                    mediaHtml = proj.mediaSrc;
                }
                
                const processHtml = proj.process.map((proc, index) => {
                    const isEven = index % 2 === 1;
                    const contentOrderClass = isEven ? 'order-2 order-lg-1' : '';
                    const mediaOrderClass = isEven ? 'order-1 order-lg-2' : '';
                    
                    let stepMediaHtml = '';
                    if (proc.mediaType === 'video') {
                        stepMediaHtml = `<video src="${proc.mediaSrc}" controls muted loop playsinline class="process-media-video"></video>`;
                    } else if (proc.mediaType === 'image') {
                        stepMediaHtml = `<img src="${proc.mediaSrc}" class="process-media-img" alt="${proc.title}">`;
                    } else if (proc.mediaType === 'svg') {
                        stepMediaHtml = proc.mediaSrc;
                    } else {
                        // Fallback: If mediaSvg is present, use it, else default to mediaSrc/mediaSvg
                        stepMediaHtml = proc.mediaSvg || proc.mediaSrc || '';
                    }
                    
                    return `
                        <div class="process-card">
                            <div class="process-card-content ${contentOrderClass}">
                                <h4 class="process-title">${proc.num}. ${proc.title}</h4>
                                <p class="process-desc">${proc.desc}</p>
                            </div>
                            <div class="process-card-media ${mediaOrderClass}">
                                ${stepMediaHtml}
                            </div>
                        </div>
                    `;
                }).join('');
                
                slideover.innerHTML = `
                    <button class="slideover-close-btn" id="slideover-close-btn" aria-label="Close Case Study">
                        <i class="ph ph-arrow-left"></i> [ Back to Archive ]
                    </button>
                    <button class="modal-close-icon" id="modal-close-icon" aria-label="Close Case Study">
                        <i class="ph ph-x"></i>
                    </button>
                    <div class="slideover-header-meta">// PROJECT_${proj.id}</div>
                    <h2 class="slideover-title">${proj.title}</h2>
                    <div class="slideover-tags">
                        ${proj.tags.map(t => `<span>${t}</span>`).join('')}
                    </div>
                    <div class="slideover-summary">
                        ${proj.descLong}
                    </div>
                    <div class="slideover-outcome-section">
                        ${mediaHtml}
                        <div class="slideover-outcome-label">${proj.outcomeLabel}</div>
                    </div>
                    <h3 class="slideover-process-title">Process &amp; Methodology</h3>
                    <div class="slideover-process-grid">
                        ${processHtml}
                    </div>
                `;
                
                document.getElementById('slideover-close-btn').addEventListener('click', closeSlideover);
                document.getElementById('modal-close-icon').addEventListener('click', closeSlideover);
                
                backdrop.classList.add('active');
                slideover.classList.add('active');
                document.body.classList.add('overflow-hidden');
            };
            
            const closeSlideover = () => {
                backdrop.classList.remove('active');
                slideover.classList.remove('active');
                document.body.classList.remove('overflow-hidden');
                
                const activeVideos = slideover.querySelectorAll('video');
                activeVideos.forEach(v => v.pause());
            };
            
            projects.forEach(card => {
                card.addEventListener('click', () => {
                    const projId = card.getAttribute('data-id');
                    openSlideover(projId);
                });
            });
            
            backdrop.addEventListener('click', closeSlideover);
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeSlideover();
            });

            // 2. Extract unique tags from database array
            const uniqueTags = new Set();
            PROJECTS_DATA.forEach(proj => {
                proj.tags.forEach(tag => uniqueTags.add(tag.trim()));
            });

            // 3. Create Filter Tag buttons
            const createFilterBtn = (text) => {
                const btn = document.createElement('button');
                btn.textContent = text;
                btn.className = `filter-btn`;
                return btn;
            };

            const filterButtons = [];
            Array.from(uniqueTags).sort().forEach(tag => {
                const btn = createFilterBtn(tag);
                filterContainer.appendChild(btn);
                filterButtons.push({ element: btn, tag: tag });
            });

            // 4. Evaluation Function for Filtering grid cards
            const evaluateProjects = () => {
                let anyActive = activeFilters.size > 0;
                
                clearFiltersBtn.classList.toggle('active', anyActive);

                const visibleProjects = new Set();
                projects.forEach(project => {
                    const projectTags = project.getAttribute('data-tags').split(',').map(t => t.trim());
                    
                    let isMatch = true;
                    for (let filter of activeFilters) {
                        if (!projectTags.includes(filter)) {
                            isMatch = false;
                            break;
                        }
                    }

                    if (isMatch || !anyActive) {
                        visibleProjects.add(project);
                        project.classList.remove('hidden-project');
                    } else {
                        project.classList.add('hidden-project');
                    }
                });

                const availableTagsNext = new Set();
                visibleProjects.forEach(proj => {
                    proj.getAttribute('data-tags').split(',').forEach(t => availableTagsNext.add(t.trim()));
                });

                filterButtons.forEach(btnObj => {
                    if (activeFilters.has(btnObj.tag) || availableTagsNext.has(btnObj.tag)) {
                        btnObj.element.classList.remove('hidden-filter');
                    } else {
                        btnObj.element.classList.add('hidden-filter');
                    }
                });
            };

            // 5. Click Events for Filter Buttons
            filterButtons.forEach(btnObj => {
                btnObj.element.addEventListener('click', () => {
                    if (activeFilters.has(btnObj.tag)) {
                        activeFilters.delete(btnObj.tag);
                        btnObj.element.classList.remove('active');
                    } else {
                        activeFilters.add(btnObj.tag);
                        btnObj.element.classList.add('active');
                    }
                    evaluateProjects();
                });
            });

            // 6. Clear Filters Action
            clearFiltersBtn.addEventListener('click', () => {
                activeFilters.clear();
                filterButtons.forEach(b => b.element.classList.remove('active'));
                evaluateProjects();
            });

            // 7. Check URL Hash to Auto-Open Case Study
            const handleHashChange = () => {
                const hash = window.location.hash; // e.g. '#06' or '#01'
                if (hash) {
                    const projId = hash.substring(1);
                    // Small timeout ensures that renderProjects() has finished compiling elements
                    setTimeout(() => {
                        openSlideover(projId);
                    }, 150);
                }
            };

            // Check on load
            handleHashChange();
            // Listen for changes
            window.addEventListener('hashchange', handleHashChange);
        });
    </script>
