<!doctype html>
<!-- THROWAWAY prototype: gate layout + tagline options for Will to pick from. Not site code. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Host+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --black:#0A0A0A; --white:#F2F2EF; --red:#E10600; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--black); color:var(--white); font-family:"Host Grotesk",system-ui,sans-serif; overflow:hidden; }

  /* picker (prototype chrome only) */
  .picker { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
    font-size:12px; background:#1a1a1a; padding:6px; border-radius:6px; }
  .picker button { background:none; border:1px solid #333; color:#aaa; padding:4px 10px; border-radius:4px; cursor:pointer; font:inherit; }
  .picker button.on { color:var(--white); border-color:var(--white); }
  .picker span { color:#666; padding:4px 4px 4px 10px; }

  .gate { position:absolute; inset:0; padding:clamp(16px,4vw,48px); display:none; }
  .gate.on { display:grid; }

  .name { font-family:"Archivo",sans-serif; font-weight:900; font-stretch:125%; text-transform:uppercase; line-height:.9; letter-spacing:-.01em; }
  .tag { color:var(--red); font-size:24px; font-weight:500; }

  /* loader: ghost logo + rising fill */
  .loader { display:flex; align-items:center; gap:14px; font-variant-numeric:tabular-nums; font-size:14px; }
  .logo { position:relative; width:56px; height:56px; }
  .logo i { position:absolute; inset:0; background:var(--white);
    -webkit-mask:url(../public/img/monogram-white-trans.png) center/contain no-repeat; mask:url(../public/img/monogram-white-trans.png) center/contain no-repeat; }
  .logo i:first-child { opacity:.15; }
  .logo i:last-child { clip-path:inset(calc(100% - var(--p,0%)) 0 0 0); }

  .choices { display:flex; flex-direction:column; gap:12px; align-items:inherit; opacity:.25; transition:opacity .4s; }
  .ready .choices { opacity:1; }
  .primary { border:1px solid var(--white); color:var(--white); background:none; padding:14px 26px; font:500 16px "Host Grotesk"; cursor:pointer; transition:background .2s,color .2s; }
  .primary:hover { background:var(--white); color:var(--black); }
  .quiet { background:none; border:none; color:#8a8a87; font:400 14px "Host Grotesk"; cursor:pointer; padding:4px; }
  .quiet:hover { color:var(--white); text-decoration:underline; }

  /* A — centred stack */
  #A { place-items:center; text-align:center; }
  #A .stack { display:flex; flex-direction:column; align-items:center; gap:28px; }
  #A .name { font-size:clamp(40px,8vw,120px); }
  #A .loader { flex-direction:column; gap:8px; }

  /* B — name left, loader bottom-left, buttons bottom-right */
  #B { grid-template-rows:1fr auto; }
  #B .head { align-self:center; }
  #B .name { font-size:clamp(48px,10vw,160px); margin-bottom:20px; }
  #B .foot { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; }
  #B .choices { align-items:flex-end; }

  /* C — name edge to edge, row beneath */
  #C { grid-template-rows:1fr auto 1fr; }
  #C .name { grid-row:2; font-size:10.4vw; white-space:nowrap; text-align:center; }
  #C .row { grid-row:3; align-self:start; display:grid; grid-template-columns:1fr auto 1fr; align-items:start; gap:24px; padding-top:24px; }
  #C .choices { align-items:flex-end; }
  #C .tag { text-align:center; }
  @media (max-width:700px) { #C .row { grid-template-columns:1fr; justify-items:center; } #C .choices { align-items:center; } }
</style>
</head>
<body>
<div class="picker">
  <span>Layout</span>
  <button data-l="A" class="on">A · Centred stack</button>
  <button data-l="B">B · Name left</button>
  <button data-l="C">C · Edge to edge</button>
  <span>Tagline</span>
  <button data-t="0" class="on">1</button>
  <button data-t="1">2</button>
  <button data-t="2">3</button>
  <button id="replay">↻ replay load</button>
</div>

<!-- A -->
<section class="gate on" id="A"><div class="stack">
  <div class="loader"><div class="logo"><i></i><i></i></div><span class="pct">000</span></div>
  <div><h1 class="name">Will Vernon</h1><p class="tag" style="margin-top:16px"></p></div>
  <div class="choices"><button class="primary">Enter with sound</button><button class="quiet">Enter without sound</button></div>
</div></section>

<!-- B -->
<section class="gate" id="B">
  <div class="head"><h1 class="name">Will<br>Vernon</h1><p class="tag"></p></div>
  <div class="foot">
    <div class="loader"><div class="logo"><i></i><i></i></div><span class="pct">000</span></div>
    <div class="choices"><button class="primary">Enter with sound</button><button class="quiet">Enter without sound</button></div>
  </div>
</section>

<!-- C -->
<section class="gate" id="C">
  <h1 class="name">Will Vernon</h1>
  <div class="row">
    <div class="loader"><div class="logo"><i></i><i></i></div><span class="pct">000</span></div>
    <p class="tag"></p>
    <div class="choices"><button class="primary">Enter with sound</button><button class="quiet">Enter without sound</button></div>
  </div>
</section>

<script>
  // Draft taglines — PLACEHOLDER copy for Will to choose from
  const TAGS = ["Design · Music · AI", "Generative design, music and AI.", "Designer. Producer. Building with AI."];
  const setTag = i => document.querySelectorAll('.tag').forEach(t => t.textContent = TAGS[i]);
  setTag(0);

  document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
    document.querySelectorAll('[data-l]').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.gate').forEach(g => g.classList.toggle('on', g.id === b.dataset.l));
  });
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    document.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b));
    setTag(+b.dataset.t);
  });

  // Fake load: uneven steps to 100 over ~3s
  let p = 0, timer;
  function load() {
    clearInterval(timer); p = 0; document.body.classList.remove('ready');
    timer = setInterval(() => {
      p = Math.min(100, p + Math.random() * 6);
      document.querySelectorAll('.logo').forEach(l => l.style.setProperty('--p', p + '%'));
      document.querySelectorAll('.pct').forEach(s => s.textContent = String(Math.floor(p)).padStart(3, '0'));
      if (p >= 100) { clearInterval(timer); document.body.classList.add('ready'); }
    }, 90);
  }
  document.getElementById('replay').onclick = load;
  load();
</script>
</body>
</html>
