<!doctype html>
<!-- THROWAWAY prototype: dot → WILL VERNON → the other letters squeeze shut → W + V morph into the monogram → name and PORTFOLIO unfold either side. Not site code.
     Glyph outlines: Host Grotesk (OFL) at wght 600, extracted with fontTools. Morphing: flubber (MIT). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/flubber@0.4.2/build/flubber.min.js"></script>
<style>
  :root { --bg:#0A0A0A; --fg:#F2F2EF; --mute:color-mix(in srgb,var(--fg) 65%,var(--bg)); --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-btn:cubic-bezier(0.16,1,0.3,1); }
  @media (prefers-color-scheme: light) { :root { --bg:#F2F2EF; --fg:#0A0A0A; } }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--bg); color:var(--fg); font-family:"Host Grotesk",system-ui,sans-serif; overflow:hidden; }

  .picker { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:10; display:flex; gap:6px 10px; flex-wrap:wrap; justify-content:center; align-items:center;
    font-size:12px; background:#1a1a1a; color:#aaa; padding:6px 10px; border-radius:6px; width:max-content; max-width:calc(100% - 24px); }
  .picker button { background:none; border:1px solid #333; color:#aaa; padding:4px 10px; border-radius:4px; cursor:pointer; font:inherit; }
  .picker button.on { color:#F2F2EF; border-color:#F2F2EF; }
  .picker label { display:flex; align-items:center; gap:6px; }
  .picker input { accent-color:#F2F2EF; width:80px; }
  .picker output { color:#F2F2EF; font-variant-numeric:tabular-nums; min-width:3em; }

  canvas, .stage { position:fixed; inset:0; width:100%; height:100%; }
  .stage { z-index:1; pointer-events:none; fill:var(--fg); }
  .gate { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:44px; padding:16px; transition:opacity .6s ease; }
  .gate.leaving { opacity:0; pointer-events:none; }
  /* mark pinned to the exact viewport centre; the button hangs below it */
  .gate.centred .choices { position:absolute; left:0; right:0; top:calc(50% + 24px * var(--ms,1) + 44px); }
  .gate > * { position:relative; }

  /* lockup: name | mark | PORTFOLIO, the mark always dead centre */
  .lockup { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:calc(16px * var(--ms,1)); width:100%; }
  .side { font-size:13px; font-weight:var(--w,600); letter-spacing:.16em; text-transform:uppercase; white-space:nowrap; }
  .side.left { justify-self:end; margin-right:-.16em; }
  .side.right { justify-self:start; display:inline-flex; letter-spacing:0; }
  .side.right .m { display:inline-block; overflow:hidden; vertical-align:top; }
  .side.right .c { display:inline-block; white-space:pre; }
  .side.right.flip .m { perspective:200px; overflow:visible; }
  .side.right .caret { display:inline-block; width:1px; height:1em; background:currentColor; margin-left:2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .wordpanel { position:fixed; left:12px; bottom:12px; z-index:10; display:flex; flex-direction:column; gap:6px; font-size:12px; background:#1a1a1a; color:#aaa; padding:8px 10px; border-radius:6px; max-width:calc(100% - 24px); }
  .wordpanel .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .wordpanel button { background:none; border:1px solid #333; color:#aaa; padding:3px 8px; border-radius:4px; cursor:pointer; font:inherit; }
  .wordpanel button.on { color:#F2F2EF; border-color:#F2F2EF; }
  .wordpanel label { display:flex; align-items:center; gap:6px; }
  .wordpanel input[type=range] { accent-color:#F2F2EF; width:80px; }
  .wordpanel output { color:#F2F2EF; font-variant-numeric:tabular-nums; min-width:3.2em; }
  .wordpanel input[type=text] { width:220px; background:#111; border:1px solid #333; color:#F2F2EF; padding:3px 6px; border-radius:4px; font:inherit; }
  .side.right.muted { color:var(--mute); }
  .mark { position:relative; display:block; aspect-ratio:808/577; height:calc(48px * var(--ms,1)); opacity:0; }
  .mark svg { position:absolute; inset:0; width:100%; height:100%; fill:currentColor; }
  .mark svg:first-child { transition:opacity .5s ease; }
  .mark.dim svg:first-child { opacity:.15; }
  .mark svg:last-child { clip-path:inset(calc(100% - var(--p,0%)) 0 0 0); }

  /* bracket button (after dkton.at) */
  .choices { display:flex; flex-direction:column; align-items:center; gap:10px; opacity:0; transform:translateY(12px); transition:opacity .7s var(--ease-out), transform .7s var(--ease-out); }
  .choices.in { opacity:1; transform:none; }
  [data-b="B"] .choices { flex-direction:row; flex-wrap:wrap; justify-content:center; }
  .bk { position:relative; background:none; border:0; color:var(--fg); cursor:pointer; padding:1.1em 2em; font:600 calc(11px * var(--bs,1.15)) "Host Grotesk"; letter-spacing:.14em; text-transform:uppercase; display:inline-flex; align-items:center; }
  .bk .plate { position:absolute; inset:0; background:var(--fg); opacity:0; transition:opacity .34s var(--ease-btn), inset .34s var(--ease-btn); }
  .bk .lbl { position:relative; transition:color .1s; }
  .bk i { position:absolute; width:.82em; height:.82em; border:1px solid currentColor; transition:transform .34s var(--ease-btn); }
  .bk i:nth-of-type(1) { top:0; left:0; border-right:0; border-bottom:0; } .bk i:nth-of-type(2) { top:0; right:0; border-left:0; border-bottom:0; }
  .bk i:nth-of-type(3) { bottom:0; left:0; border-right:0; border-top:0; } .bk i:nth-of-type(4) { bottom:0; right:0; border-left:0; border-top:0; }
  .bk.quiet { color:var(--mute); font-weight:500; padding:.75em 1.3em; }
  .bk.quiet i { display:none; }
  [data-b="B"] .bk.quiet i { display:block; opacity:.5; }
  [data-b="C"] .bk.quiet { position:fixed; left:50%; bottom:28px; translate:-50% 0; }
  @media (hover:hover) and (pointer:fine) {
    .bk:hover .plate { opacity:.1; inset:4px; }
    .bk:hover i:nth-of-type(1) { transform:translate(-3px,-3px); } .bk:hover i:nth-of-type(2) { transform:translate(3px,-3px); }
    .bk:hover i:nth-of-type(3) { transform:translate(-3px,3px); } .bk:hover i:nth-of-type(4) { transform:translate(3px,3px); }
    .bk.quiet:hover { color:var(--fg); }
  }
  .bk:active .plate { opacity:1; inset:0; transition-duration:.1s; }
  .bk:active .lbl { color:var(--bg); }

  .done { position:fixed; inset:0; display:grid; place-items:center; font-size:13px; opacity:0; transition:opacity 1s ease; color:var(--mute); cursor:pointer; pointer-events:none; }
  .done.in { opacity:1; pointer-events:auto; }
</style>
</head>

    const xs = ps.map(p => p.x), ys = ps.map(p => p.y);
    slide[id] = id === 'l' ? { x: -(Math.max(...xs) + GAP), y: 0 } : id === 'r' ? { x: W - Math.min(...xs) + GAP, y: 0 }
              : id === 'b' ? { x: 0, y: H - Math.min(...ys) + GAP } : { x: 0, y: -(Math.max(...ys) + GAP) };
  }
  cx.restore();
}
/* ---------- mouse: spotlight, lens, repel, ripple on click (mouse only; off for touch and reduced motion) ---------- */
const MOUSE_OK = !reduced && matchMedia('(hover: hover) and (pointer: fine)').matches;
const mouse = { x: 0, y: 0, tx: 0, ty: 0, a: 0, on: false };
const fx = { spot: true, lens: true, repel: true, ripple: true };
// ripples: rings sent out by clicks
const ripples = [];
function addRipple(x, y, amp) { ripples.push({ x, y, t: performance.now(), amp }); if (ripples.length > 6) ripples.shift(); }
if (MOUSE_OK) {
  addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && fx.ripple) addRipple(e.clientX, e.clientY, 1); });
  addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; mouse.tx = e.clientX; mouse.ty = e.clientY; if (!mouse.a) { mouse.x = e.clientX; mouse.y = e.clientY; } mouse.on = true; });
  document.documentElement.addEventListener('pointerleave', () => { mouse.on = false; });
}
const mv = id => +$(id).value;

function drawDots(t) {
  // cursor eases toward the pointer; influence fades in/out when it enters/leaves the window
  mouse.x += (mouse.tx - mouse.x) * .25; mouse.y += (mouse.ty - mouse.y) * .25;
  mouse.a += ((mouse.on ? 1 : 0) - mouse.a) * .08;
  const R = mv('mr'), glow = mv('mg'), lens = mv('ml'), push = mv('mp'), stiff = mv('mk'), now = performance.now();
  const rSpeed = mv('rv'), rWidth = mv('rw'), rLife = mv('rl') * 1000;
  while (ripples.length && now - ripples[0].t > rLife) ripples.shift();
  cx.clearRect(0, 0, W, H); cx.fillStyle = getComputedStyle(document.body).color;
  for (const p of dots) {
    if (p.hole) continue;
    // slide in from the piece's edge once the morph is done; reduced motion: a 200ms fade
    const pi = PIECES.indexOf(p.piece), go = phase(t, T.swap + pi * mv('dstag'), reduced ? 200 : mv('ddur'));
    if (go <= 0) continue;
    const e = slideEase(go), sl = slide[p.piece] || { x: 0, y: 0 }, m = reduced ? 0 : 1 - e;
    const bloomed = go >= 1 ? 1 : 0; // mouse effects wait until the piece has landed
    const sx = sl.x * m, sy = sl.y * m;
    // f: 1 under the cursor, 0 at radius R (smooth falloff), only once the bloom has reached the dot
    const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
    const f = MOUSE_OK ? (1 - Math.min(1, d / R)) ** 2 * mouse.a * bloomed : 0;
    // repel: spring toward an offset pointing away from the cursor
    if (MOUSE_OK) {
      const tx = fx.repel && d > .01 ? dx / d * push * f : 0, ty = fx.repel && d > .01 ? dy / d * push * f : 0;
      p.vx = ((p.vx || 0) + (tx - (p.ox || 0)) * stiff) * .72; p.vy = ((p.vy || 0) + (ty - (p.oy || 0)) * stiff) * .72;
      p.ox = (p.ox || 0) + p.vx; p.oy = (p.oy || 0) + p.vy;
    }
    // ripple: a bright ring like the bloom's wavefront, fading as it travels
    let ring = 0;
    for (const rp of ripples) {
      const age = now - rp.t, dist = Math.hypot(p.x - rp.x, p.y - rp.y);
      ring += rp.amp * Math.max(0, 1 - Math.abs(dist - age / 1000 * rSpeed) / rWidth) * (1 - age / rLife);
    }
    ring *= bloomed;
    cx.globalAlpha = BASE * (reduced ? go : Math.min(1, e * 2.5));
    if (fx.spot) cx.globalAlpha += glow * f;
    cx.globalAlpha += .45 * ring;
    const r = (fx.lens ? 1 + (lens - 1) * f : 1) + .5 * Math.min(1, ring);
    cx.fillRect(p.x + sx + (p.ox || 0) - r, p.y + sy + (p.oy || 0) - r, r * 2, r * 2);
  }
  cx.globalAlpha = 1;
}

/* ---------- the big name, as real glyph outlines ---------- */
const letters = [...NAME].map((ch, i) => ({ ch, i, keep: KEEP.includes(ch), adv: GLYPHS.glyphs[ch].adv }));
const ns = 'http://www.w3.org/2000/svg';
$('name').innerHTML = '';
for (const L of letters) {
  const g = document.createElementNS(ns, 'g'), p = document.createElementNS(ns, 'path');
  p.setAttribute('d', GLYPHS.glyphs[L.ch].d); g.appendChild(p); $('name').appendChild(g); L.el = g; L.path = p;
}
let S = 1, markRect, morphFn = null;

function measure() {
  layoutDots();
  $('stage').setAttribute('viewBox', `0 0 ${W} ${H}`);
  markRect = $('mark').getBoundingClientRect();
  origin = { x: markRect.left + markRect.width / 2, y: markRect.top + markRect.height / 2 };
  carve();
  S = Math.min(Math.max(innerWidth * .06, 34), 72) / GLYPHS.upm; // font size clamp(34px, 6vw, 72px)
  morphFn = null;
}

// x of every letter for a given squeeze amount e (0 = full name, 1 = only W V left)
function layoutName(e) {
  let x = 0; const xs = [];
  letters.forEach((L, i) => {
    const k = L.keep ? 1 : 1 - e;
    xs.push({ x, sx: k });
    if (i < letters.length - 1) x += L.adv * k + TRACK * k; else x += L.adv * k;
  });
  return { xs, width: x };
}

function sampleRing(pathEl, tx, ty, s, n = 160) {
  // first contour only: W and V are single contours in Host Grotesk
  const d = pathEl.getAttribute('d').split(/(?=M)/)[0];
  const tmp = document.createElementNS(ns, 'path'); tmp.setAttribute('d', d);
  $('stage').appendChild(tmp);
  const len = tmp.getTotalLength(), ring = [];
  for (let k = 0; k < n; k++) { const pt = tmp.getPointAtLength(len * k / n); ring.push([tx + pt.x * s, ty + pt.y * s]); }
  tmp.remove(); return ring;
}

function buildMorph() {
  const { xs, width } = layoutName(1);
  const left = origin.x - width * S / 2, top = origin.y - GLYPHS.cap * S / 2;
  const rings = letters.filter(L => L.keep).map(L => sampleRing(L.path, left + xs[L.i].x * S, top, S));
  const target = MARK_PTS.map(([x, y]) => [markRect.left + (x - 136) / 808 * markRect.width, markRect.top + (y - 251) / 577 * markRect.height]);
  morphFn = flubber.combine(rings, target, { single: true, maxSegmentLength: 4 });
}

/* ---------- render the whole intro for time t ---------- */
let t0 = 0, spd = 1, raf = 0, progress = 0, lastTick = 0;
function render(now) {
  const t = reduced ? 1e6 : (now - t0) * spd;
  drawDots(t);

  // 1. seed dot
  const seed = $('seed');
  seed.setAttribute('cx', origin.x); seed.setAttribute('cy', origin.y);
  seed.setAttribute('opacity', 0); // removed: no seed dot

  // 2–3. name rises letter by letter, then the non-initials squeeze shut
  const e = inOut(phase(t, T.squeeze, DUR.squeeze));
  const { xs, width } = layoutName(e);
  const left = origin.x - width * S / 2, top = origin.y - GLYPHS.cap * S / 2;
  const showName = t < T.morph;
  $('name').style.display = showName ? '' : 'none';
  if (showName) letters.forEach(L => {
    const r = outCubic(phase(t, T.rise + L.i * 35, DUR.rise));
    const dy = (1 - r) * GLYPHS.cap * S * .9;
    const { x, sx } = xs[L.i];
    L.el.setAttribute('transform', `translate(${left + x * S} ${top + dy}) scale(${S * Math.max(sx, .0001)} ${S})`);
    L.el.setAttribute('opacity', r * (L.keep ? 1 : Math.min(1, sx * 1.6)));
  });

  // 4. W + V morph into the monogram
  const m = phase(t, T.morph, DUR.morph);
  if (t >= T.morph && t < T.swap) {
    if (!morphFn) buildMorph();
    $('morph').setAttribute('d', morphFn(inOut(m)));
  } else $('morph').setAttribute('d', '');

  // 5. the real mark (with the loader fill) takes over; the unloaded part dims to a ghost
  const mark = $('mark');
  mark.style.opacity = t >= T.swap ? 1 : 0;
  mark.classList.toggle('dim', t >= T.swap + 150);

  // 6. name and PORTFOLIO unfold out of either side of the mark
  const u = outCubic(phase(t, T.unfold, DUR.unfold));
  $('left').style.clipPath = `inset(0 0 0 ${(1 - u) * 100}%)`;
  $('left').style.transform = `translateX(${(1 - u) * 24}px)`;
  $('right').style.clipPath = `inset(0 ${(1 - u) * 100}% 0 0)`;
  $('right').style.transform = `translateX(${(1 - u) * -24}px)`;

  // 7. the choices
  $('choices').classList.toggle('in', t >= T.choices);

  // fake loading, from the start
  if (now - lastTick > 70 && progress < 100) { progress = Math.min(100, progress + Math.random() * 3); lastTick = now; mark.style.setProperty('--p', progress + '%'); }

  raf = requestAnimationFrame(render);
}

function play() {
  cancelAnimationFrame(raf);
  $('gate').classList.remove('leaving'); $('done').classList.remove('in');
  progress = 0; $('mark').style.setProperty('--p', '0%');
  measure(); t0 = performance.now(); raf = requestAnimationFrame(render);
  rotate((T.choices + 600) / spd);
}
document.querySelectorAll('.bk').forEach(b => b.onclick = () => { $('gate').classList.add('leaving'); setTimeout(() => $('done').classList.add('in'), 600); });
$('done').onclick = play;
addEventListener('resize', measure);

/* ---------- the rotating word: a slot as wide as WILL VERNON ---------- */
const right = $('right'), meter = document.createElement('span');
meter.className = 'side'; meter.style.cssText = 'position:absolute;visibility:hidden;letter-spacing:0';
document.body.appendChild(meter);
let words = [], wi = 0, fit = true, style = 'roll', run = 0;
const opt = () => ({ dur: +$('wdur').value, stag: +$('stag').value, hold: +$('hold').value * 1000 });
const readWords = () => $('words').value.split(',').map(w => w.trim()).filter(Boolean);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const EASE = 'cubic-bezier(0.23, 1, 0.32, 1)';
const SCRAMBLE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#*+';

function spacingFor(word) {
  // letter-spacing that makes `word` exactly as wide as the name on the left
  const L = $('left'), lsL = parseFloat(getComputedStyle(L).letterSpacing);
  meter.textContent = L.textContent; const nameW = meter.getBoundingClientRect().width + lsL * (L.textContent.length - 1);
  meter.textContent = word; const wordW = meter.getBoundingClientRect().width;
  // capped: long words match the name exactly, short ones stop at 4px and fall a little short
  return fit ? Math.min(4, Math.max(1.5, (nameW - wordW) / Math.max(word.length - 1, 1))) : lsL;
}
function renderWord(word) {
  const ls = spacingFor(word);
  right.getAnimations().forEach(a => a.cancel());
  right.innerHTML = [...word].map((ch, i) => `<span class="m"><span class="c" style="margin-right:${i < word.length - 1 ? ls : 0}px">${ch}</span></span>`).join('');
  right.setAttribute('aria-label', word);
  return [...right.querySelectorAll('.c')];
}
// one keyframe animation per letter, staggered; resolves when the last one ends
function each(cs, frames, { dur, stag }) {
  return Promise.all(cs.map((c, i) => c.animate(frames, { duration: dur, delay: i * stag, easing: EASE, fill: 'both' }).finished));
}

const STYLES = {
  // letters roll up out of their masks, new ones roll up from below
  roll: { out: (cs, o) => each(cs, [{ transform: 'none' }, { transform: 'translateY(-105%)' }], o),
          in: (cs, o) => each(cs, [{ transform: 'translateY(105%)' }, { transform: 'none' }], o) },
  // split-flap: each letter flips over its horizontal axis
  flip: { out: (cs, o) => each(cs, [{ transform: 'rotateX(0)', opacity: 1 }, { transform: 'rotateX(90deg)', opacity: .2 }], { ...o, dur: o.dur / 2 }),
          in: (cs, o) => each(cs, [{ transform: 'rotateX(-90deg)', opacity: .2 }, { transform: 'rotateX(0)', opacity: 1 }], { ...o, dur: o.dur / 2 }) },
  // soft: letters blur and drift up, new ones sharpen in
  blur: { out: (cs, o) => each(cs, [{ filter: 'blur(0)', opacity: 1, transform: 'none' }, { filter: 'blur(8px)', opacity: 0, transform: 'translateY(-30%)' }], o),
          in: (cs, o) => each(cs, [{ filter: 'blur(8px)', opacity: 0, transform: 'translateY(30%)' }, { filter: 'blur(0)', opacity: 1, transform: 'none' }], o) },
  // the whole word moves as one (stagger ignored)
  slide: { out: (cs, o) => each(cs, [{ transform: 'none' }, { transform: 'translateY(-105%)' }], { ...o, stag: 0 }),
           in: (cs, o) => each(cs, [{ transform: 'translateY(105%)' }, { transform: 'none' }], { ...o, stag: 0 }) },
  // no exit: letters cycle through glyphs and lock in left to right
  scramble: { out: () => Promise.resolve(),
    in: (cs, o, word) => new Promise(done => {
      const t0 = performance.now();
      (function tick(now) {
        let all = true;
        cs.forEach((c, i) => {
          const lockAt = i * Math.max(o.stag, 20) + o.dur * .6;
          if (now - t0 < lockAt) { all = false; if (word[i] !== ' ') c.textContent = SCRAMBLE[(Math.random() * SCRAMBLE.length) | 0]; }
          else c.textContent = word[i];
        });
        all ? done() : requestAnimationFrame(tick);
      })(t0);
    }) },
  // backspace to the mark, then type the next word (stagger sets the typing speed)
  type: { out: async (cs, o) => { const step = Math.max(o.stag, 15) * 1.2; for (let i = cs.length - 1; i >= 0; i--) { cs[i].style.visibility = 'hidden'; await sleep(step); } },
          in: async (cs, o) => { const step = Math.max(o.stag, 15) * 2; cs.forEach(c => c.style.visibility = 'hidden'); for (const c of cs) { await sleep(step); c.style.visibility = ''; } } },
  // the word folds back into the mark and the next one unfolds out of it, like the intro
  fold: { out: (cs, o) => right.animate([{ clipPath: 'inset(0 0 0 0)', transform: 'none' }, { clipPath: 'inset(0 100% 0 0)', transform: 'translateX(-12px)' }], { duration: o.dur, easing: 'cubic-bezier(0.77, 0, 0.175, 1)', fill: 'both' }).finished,
          in: (cs, o) => right.animate([{ clipPath: 'inset(0 100% 0 0)', transform: 'translateX(-12px)' }, { clipPath: 'inset(0 0 0 0)', transform: 'none' }], { duration: o.dur, easing: EASE, fill: 'both' }).finished },
};

let busy = false;
async function change(word) {
  busy = true;
  const o = opt(), S = STYLES[style];
  right.classList.toggle('flip', style === 'flip');
  const old = [...right.querySelectorAll('.c')];
  if (old.length) await S.out(old, o);
  const cs = renderWord(word);
  if (style === 'fold') right.animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 100% 0 0)' }], { duration: 1, fill: 'forwards' });
  if (style === 'type') right.insertAdjacentHTML('beforeend', '<span class="caret"></span>');
  await S.in(cs, o, word);
  right.querySelector('.caret')?.remove();
  busy = false;
}
// loops: hold, change, hold, change… A newer call cancels an older loop.
async function rotate(delay, keepWord = false) {
  const my = ++run;
  words = readWords();
  if (!keepWord) { wi = 0; renderWord(words[0] || ''); }
  await sleep(delay);
  while (my === run && words.length > 1) {
    await sleep(opt().hold); if (my !== run) return;
    wi = (wi + 1) % words.length; await change(words[wi]);
  }
}
async function changeNow() {
  if (busy) return;
  run++; words = readWords(); wi = (wi + 1) % words.length;
  await change(words[wi]); rotate(0, true);
}
$('words').onchange = () => rotate(0);
$('fit').onclick = () => { fit = !fit; $('fit').classList.toggle('on', fit); renderWord(words[wi] || ''); };
$('grey').onclick = () => { $('grey').classList.toggle('on'); right.classList.toggle('muted'); };
$('next').onclick = changeNow;
document.querySelectorAll('[data-ws]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-ws]').forEach(x => x.classList.toggle('on', x === b));
  style = b.dataset.ws; changeNow();
});
for (const [id, f] of [['hold', v => v + 's'], ['wdur', v => v + 'ms'], ['stag', v => v + 'ms']]) {
  const upd = () => $(id + 'o').value = f($(id).value); $(id).addEventListener('input', upd); upd();
}

/* controls */
$('dbez').onchange = () => { const v = $('dbez').value.split(',').map(Number); if (v.length === 4 && v.every(isFinite)) slideEase = bezier(...v); };
for (const k of ['spot', 'lens', 'repel', 'ripple']) $('fx-' + k).onclick = () => { fx[k] = !fx[k]; $('fx-' + k).classList.toggle('on', fx[k]); };
for (const [id, f] of [['ddur', v => v + 'ms'], ['dstag', v => v + 'ms'], ['mr', v => v + 'px'], ['mg', v => '+' + Math.round(v * 100) + '%'], ['ml', v => (+v).toFixed(1) + '×'], ['rv', v => v + 'px/s'], ['rw', v => v + 'px'], ['rl', v => v + 's'], ['mp', v => v + 'px'], ['mk', v => (+v).toFixed(2)]]) {
  const upd = () => $(id + 'o').value = f($(id).value); $(id).addEventListener('input', upd); upd();
}
const revoid = () => { $('vso').value = (+$('vs').value).toFixed(2) + '× vh'; $('vmo').value = $('vm').value + 'px'; $('vyo').value = $('vy').value + '% vh'; carve(); drawDots(1e6); };
$('vs').oninput = $('vm').oninput = $('vy').oninput = revoid;
$('centre').onclick = () => { $('gate').classList.toggle('centred'); $('centre').classList.toggle('on'); measure(); revoid(); };
$('void').onclick = () => { voidOn = !voidOn; $('void').classList.toggle('on', voidOn); revoid(); };
$('vso').value = '1.00× vh'; $('vmo').value = '0px'; $('vyo').value = '0% vh';
const root = document.documentElement;
function sync() {
  root.style.setProperty('--w', $('w').value); $('wo').value = $('w').value;
  root.style.setProperty('--ms', $('ms').value); $('mso').value = (+$('ms').value).toFixed(2) + '×';
  root.style.setProperty('--bs', $('bs').value); $('bso').value = (+$('bs').value).toFixed(2) + '×';
  spd = +$('spd').value; $('spdo').value = spd.toFixed(2) + '×';
}
$('w').oninput = () => { sync(); renderWord(words[wi] || ''); };
$('bs').oninput = $('spd').oninput = sync;
$('ms').oninput = () => { sync(); measure(); };
$('replay').onclick = play;
sync();
document.fonts.ready.then(play);
</script>
</body>
